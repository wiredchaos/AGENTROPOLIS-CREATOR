<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEUROBLOCK SERIES LAB</title><style>
:root{--bg:#020509;--panel:#07111d;--line:#18344b;--cyan:#00ffd5;--red:#ff335f;--white:#eef7ff;--muted:#8197aa;--amber:#ffc857}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#0a2a3a,#020509 44%);color:var(--white);font-family:Inter,system-ui,Arial,sans-serif}button,input,textarea{font:inherit}button{background:#0b1b2a;color:var(--white);border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer}button:hover{border-color:var(--cyan)}input,textarea{width:100%;background:#020910;color:var(--white);border:1px solid var(--line);border-radius:9px;padding:8px}textarea{min-height:68px}.app{min-height:100vh;display:grid;grid-template-rows:68px 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#02070ce8}.brand{font-weight:900;letter-spacing:.08em}.brand span{color:var(--cyan)}.tag{font-size:12px;color:var(--muted);margin-top:3px}.badge{padding:6px 9px;border:1px solid #00ffd555;border-radius:999px;color:var(--cyan);font-size:12px}.main{display:grid;grid-template-columns:250px 1fr 340px;min-height:0}.panel{background:#06111ddb;padding:14px;overflow:auto}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.section{margin-bottom:19px}.section h3{font-size:11px;color:var(--cyan);letter-spacing:.15em;text-transform:uppercase;margin:0 0 9px}.tool{width:100%;margin:5px 0;text-align:left}.workspace{display:grid;grid-template-rows:auto 1fr 190px;min-width:0}.statusbar{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);overflow:auto;background:#04101a}.pill{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:12px;color:var(--muted)}.pill strong{color:var(--white)}.episodes{padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px;overflow:auto}.episode{background:linear-gradient(145deg,#091a29,#06101a);border:1px solid var(--line);border-radius:15px;padding:12px;cursor:pointer}.episode.active{border-color:var(--cyan);box-shadow:0 0 20px #00ffd51e}.episode .num{font-size:11px;color:var(--cyan);letter-spacing:.12em}.episode h4{margin:7px 0 6px}.episode p{margin:0 0 10px;color:#bfd0dc;font-size:13px;line-height:1.35}.bar{height:7px;background:#142638;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--cyan))}.meta{font-size:11px;color:var(--muted);margin-top:7px}.continuity{border-top:1px solid var(--line);padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#04101bcc;overflow:auto}.matrix,.timeline{background:#071522;border:1px solid var(--line);border-radius:12px;padding:10px}.row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid #17324766;font-size:12px}.row:last-child{border-bottom:0}.heat{font-weight:800}.good{color:var(--cyan)}.warn{color:var(--amber)}.bad{color:var(--red)}label{display:block;font-size:11px;color:var(--muted);margin-top:9px}.notice{border:1px solid #ff335f77;background:#240912;border-radius:10px;padding:9px;margin:7px 0;font-size:12px;color:#ffd7df}.ok{border-color:#00ffd566;background:#06231f;color:#d3fff8}.card{border:1px solid var(--line);background:#081726;border-radius:12px;padding:10px;margin-bottom:8px}.card b{font-size:13px}.card small{display:block;color:var(--muted);margin-top:3px}.export{white-space:pre-wrap;background:#020910;border:1px solid var(--line);border-radius:12px;padding:10px;color:#d8fff7;font-size:11px;max-height:260px;overflow:auto}@media(max-width:980px){.main{grid-template-columns:1fr}.left,.right{display:none}.continuity{grid-template-columns:1fr}}
</style></head><body><div class="app"><header class="top"><div><div class="brand">NEUROBLOCK <span>SERIES LAB</span></div><div class="tag">Episodic continuity control for AI-native cinematic series</div></div><span class="badge">LOCAL MVP</span></header><main class="main"><aside class="panel left"><div class="section"><h3>Series</h3><button class="tool" onclick="seed()">Load Demo Series</button><button class="tool" onclick="addEpisode()">+ Episode</button><button class="tool" onclick="save(true)">Save Local</button><button class="tool" onclick="load()">Load Local</button><button class="tool" onclick="exportPacket()">Export Episode Packet</button></div><div class="section"><h3>Character Bible</h3><div id="characters"></div></div><div class="section"><h3>Agent Showrunner</h3><div id="tips"></div></div></aside><section class="workspace"><div id="statusbar" class="statusbar"></div><div id="episodes" class="episodes"></div><div class="continuity"><div class="matrix"><div class="section"><h3>Relationship Matrix</h3><div id="relationships"></div></div></div><div class="timeline"><div class="section"><h3>Threat Escalation</h3><div id="threats"></div></div></div></div></section><aside class="panel right"><div class="section"><h3>Episode Inspector</h3><div id="inspector"></div></div><div class="section"><h3>Continuity Drift</h3><div id="warnings"></div></div><div class="section"><h3>Execution Packet</h3><div id="export" class="export">Select an episode and export its production packet.</div></div></aside></main></div><script>
const key='neuroblock-series-lab';let state={series:'',characters:[],relationships:[],episodes:[],active:0};
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function attr(v=''){return esc(v)}function uid(){return Math.random().toString(36).slice(2,9)}function activeEp(){return state.episodes[state.active]}
function seed(){state={series:'ORBITAL WIDOWS',characters:[{name:'Mara Voss',role:'Field lead',look:'obsidian pressure suit / cyan visor',anchor:'protects the squad before herself'},{name:'Inez Vale',role:'Pilot / engineer',look:'silver utility rig / red scarf',anchor:'jokes when frightened'},{name:'Dr. Sato',role:'Xenobiologist',look:'white field coat over armor',anchor:'cannot resist studying the threat'}],relationships:[{a:'Mara Voss',b:'Inez Vale',state:'earned trust',heat:78},{a:'Mara Voss',b:'Dr. Sato',state:'strategic friction',heat:54},{a:'Inez Vale',b:'Dr. Sato',state:'protective banter',heat:67}],episodes:[{id:'e1',title:'Wake Signal',summary:'A salvage ping leads the squad into a silent research ring.',location:'abandoned orbital ring',threat:'glass-wing crawler',level:2,camera:'slow handheld push / 35mm',lighting:'cold cyan practicals',dialogue:'Keep the channel open.',wardrobe:'baseline suits intact',prop:'signal prism recovered',relationship:'Mara trusts Inez with command override',continuity:'Prism enters inventory. Sato receives forearm cut.'},{id:'e2',title:'Quiet Teeth',summary:'The recovered prism begins broadcasting from inside the ship.',location:'crew transport',threat:'needle swarm',level:3,camera:'locked corridors / 50mm closeups',lighting:'emergency red with cyan spill',dialogue:'That signal is answering us.',wardrobe:'Sato forearm bandaged',prop:'signal prism active',relationship:'Inez challenges Mara over quarantine',continuity:'Sato bandage remains. Prism glow increases.'},{id:'e3',title:'The Nest Below',summary:'The source signal points to a buried biosphere beneath an ice moon.',location:'subglacial vault',threat:'burrow queen',level:5,camera:'wide descent / macro inserts',lighting:'blue ice bounce / amber spores',dialogue:'We did not find a nest. We found a city.',wardrobe:'cold-weather shell over baseline suits',prop:'prism mounted on scanner',relationship:'Mara and Inez reconcile under pressure',continuity:'Prism mounted, not handheld. Sato cut healing.'},{id:'e4',title:'Borrowed Faces',summary:'The enemy begins copying the squad voices to separate them.',location:'maintenance labyrinth',threat:'mimic drone',level:7,camera:'long lens surveillance / whip turns',lighting:'failing strip lights',dialogue:'Do not answer me unless you can see me.',wardrobe:'same cold-weather shell, damaged',prop:'scanner prism tether intact',relationship:'Sato becomes temporary trust bottleneck',continuity:'Damage from E3 persists. No clean wardrobe reset.'}],active:0};render()}
function addEpisode(){state.episodes.push({id:uid(),title:'Untitled Episode',summary:'',location:'',threat:'',level:1,camera:'',lighting:'',dialogue:'',wardrobe:'',prop:'',relationship:'',continuity:''});state.active=state.episodes.length-1;render()}
function score(e){let f=['title','summary','location','threat','camera','lighting','wardrobe','prop','relationship','continuity'];return Math.round(f.filter(k=>String(e[k]||'').trim()).length/f.length*100)}
function render(){renderStatus();renderEpisodes();renderCharacters();renderRelationships();renderThreats();renderInspector();validate();save(false)}
function renderStatus(){let avg=state.episodes.length?Math.round(state.episodes.reduce((a,e)=>a+score(e),0)/state.episodes.length):0;document.getElementById('statusbar').innerHTML=`<span class='pill'><strong>${esc(state.series||'UNTITLED SERIES')}</strong></span><span class='pill'>Episodes <strong>${state.episodes.length}</strong></span><span class='pill'>Cast <strong>${state.characters.length}</strong></span><span class='pill'>Readiness <strong>${avg}%</strong></span><span class='pill'>Execution <strong>GATED</strong></span>`}
function renderEpisodes(){let box=document.getElementById('episodes');box.innerHTML='';state.episodes.forEach((e,i)=>{let s=score(e),d=document.createElement('div');d.className='episode '+(i===state.active?'active':'');d.onclick=()=>{state.active=i;render()};d.innerHTML=`<div class='num'>EP ${String(i+1).padStart(2,'0')} · THREAT ${e.level}/10</div><h4>${esc(e.title)}</h4><p>${esc(e.summary||'No synopsis yet.')}</p><div class='bar'><i style='width:${s}%'></i></div><div class='meta'>${s}% ready · ${esc(e.location||'location unset')}</div>`;box.appendChild(d)})}
function renderCharacters(){document.getElementById('characters').innerHTML=state.characters.map(c=>`<div class='card'><b>${esc(c.name)}</b><small>${esc(c.role)}</small><small>${esc(c.look)}</small><small>Anchor: ${esc(c.anchor)}</small></div>`).join('')||'<div class="notice">No character bible entries.</div>'}
function renderRelationships(){document.getElementById('relationships').innerHTML=state.relationships.map(r=>`<div class='row'><span>${esc(r.a)} ↔ ${esc(r.b)}<br><small>${esc(r.state)}</small></span><span class='heat ${r.heat>70?'good':r.heat>45?'warn':'bad'}'>${r.heat}</span></div>`).join('')}
function renderThreats(){document.getElementById('threats').innerHTML=state.episodes.map((e,i)=>`<div class='row'><span>EP ${i+1} · ${esc(e.threat||'unset')}</span><span class='heat ${e.level>=7?'bad':e.level>=4?'warn':'good'}'>${e.level}/10</span></div>`).join('')}
function renderInspector(){let e=activeEp(),box=document.getElementById('inspector');if(!e){box.innerHTML='<div class="notice">Add an episode.</div>';return}box.innerHTML=`<label>Title</label><input value='${attr(e.title)}' oninput="edit('title',this.value)"><label>Synopsis</label><textarea oninput="edit('summary',this.value)">${esc(e.summary)}</textarea><label>Location</label><input value='${attr(e.location)}' oninput="edit('location',this.value)"><label>Threat</label><input value='${attr(e.threat)}' oninput="edit('threat',this.value)"><label>Threat Level 1-10</label><input type='number' min='1' max='10' value='${e.level}' oninput="edit('level',Math.max(1,Math.min(10,+this.value||1)))"><label>Camera Contract</label><input value='${attr(e.camera)}' oninput="edit('camera',this.value)"><label>Lighting Contract</label><input value='${attr(e.lighting)}' oninput="edit('lighting',this.value)"><label>Dialogue Anchor</label><textarea oninput="edit('dialogue',this.value)">${esc(e.dialogue)}</textarea><label>Wardrobe State</label><input value='${attr(e.wardrobe)}' oninput="edit('wardrobe',this.value)"><label>Hero Prop State</label><input value='${attr(e.prop)}' oninput="edit('prop',this.value)"><label>Relationship Change</label><textarea oninput="edit('relationship',this.value)">${esc(e.relationship)}</textarea><label>Continuity Ledger</label><textarea oninput="edit('continuity',this.value)">${esc(e.continuity)}</textarea>`}
function edit(k,v){let e=activeEp();if(!e)return;e[k]=v;render()}
function sharedWords(a,b){let A=new Set(String(a).toLowerCase().split(/\W+/).filter(x=>x.length>3));return String(b).toLowerCase().split(/\W+/).some(x=>A.has(x))}
function validate(){let w=[],e=activeEp(),prev=state.episodes[state.active-1];if(!e){document.getElementById('warnings').innerHTML='';return}if(score(e)<80)w.push('Episode contract is below 80% readiness.');if(prev&&e.level<prev.level-2)w.push('Threat level drops sharply; confirm intentional decompression.');if(prev&&prev.prop&&e.prop&&!sharedWords(prev.prop,e.prop))w.push('Hero prop state may have reset between episodes.');if(prev&&/bandag|injur|cut|damage/i.test(prev.continuity||'')&&!/bandag|heal|injur|cut|damage/i.test((e.continuity||'')+' '+(e.wardrobe||'')))w.push('Prior injury or damage state is not acknowledged.');if(!e.relationship)w.push('Relationship-state change is missing.');document.getElementById('warnings').innerHTML=(w.length?w:['Continuity checks look stable.']).map(x=>`<div class='notice ${w.length?'':'ok'}'>${esc(x)}</div>`).join('');document.getElementById('tips').innerHTML=['Lock face, wardrobe, prop, and injury state before generation.','Treat each approved episode packet as the next episode retrieval context.','Route generation through governed MCP only after continuity and rights checks pass.'].map(x=>`<div class='notice ok'>${x}</div>`).join('')}
function exportPacket(){let e=activeEp();if(!e)return;let prev=state.episodes[state.active-1];document.getElementById('export').textContent=`NEUROBLOCK SERIES LAB · EPISODE EXECUTION PACKET\n\nSeries: ${state.series}\nEpisode: ${state.active+1} · ${e.title}\nReadiness: ${score(e)}%\n\nSTORY\n${e.summary}\n\nPRODUCTION CONTRACT\nLocation: ${e.location}\nThreat: ${e.threat} (${e.level}/10)\nCamera: ${e.camera}\nLighting: ${e.lighting}\nDialogue Anchor: ${e.dialogue}\nWardrobe: ${e.wardrobe}\nHero Prop: ${e.prop}\nRelationship Change: ${e.relationship}\nContinuity Ledger: ${e.continuity}\n\nRETRIEVAL CONTEXT\nPrevious Episode: ${prev?prev.title:'None'}\nPrevious Continuity: ${prev?prev.continuity:'N/A'}\n\nGOVERNED EXECUTION\nStatus: HUMAN APPROVAL REQUIRED\nRoute: CREATOR -> AGENT-MCP -> ASBE -> approved video model / Higgsfield adapter\nReceipts: prompt contract + model route + asset provenance + media diff + approval receipt`}
function save(alertUser){localStorage.setItem(key,JSON.stringify(state));if(alertUser)alert('Series state saved locally.')}function load(){let v=localStorage.getItem(key);if(v){state=JSON.parse(v);render()}}seed();
</script></body></html>
